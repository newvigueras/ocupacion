# Alembic: solo hace falta para crear migraciones nuevas al cambiar las tablas.
# La base se toma de PLANIFICADOR_BD (por defecto, sqlite:///planificador.db).
#
#   alembic revision --autogenerate -m "qué cambia"
#   alembic upgrade head        (preparar_bd ya lo hace solo)

[alembic]
script_location = planificador.bd:migraciones
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
