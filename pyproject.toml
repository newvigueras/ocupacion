[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planificador-lasala"
version = "0.2.0"
description = "Planificador de Ocupación de Viveros La Sala"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1", "sqlalchemy>=2.0", "alembic>=1.13",
    # Fase 3: aplicación web
    "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
pdf = ["pdfplumber>=0.11"]

[project.scripts]
planificador = "planificador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planificador = ["datos/*.json", "bd/migraciones/script.py.mako", "web/plantillas/*.html",
                "web/estatico/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
