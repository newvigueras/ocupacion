[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planificador-lasala"
version = "0.2.0"
description = "Planificador de Ocupación de Viveros La Sala"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "sqlalchemy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pdfplumber>=0.11"]

[project.scripts]
planificador = "planificador.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planificador = ["datos/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
